# 推荐档位：只开词面止损，不开答案闸门。
# 在 casebook 真实语料（19 案例 / 30 问句 + 8 个语料外问句）上实测：
#   stop-only  误拒 0/30，语料外抓到 5/8，轮数 82->73，分级候选 410->365
#   gate-only  误拒 5/30，语料外抓到 7/8，成本不变
# 闸门多抓到的 2 个，代价是把 5 个语料内可答的问题也拒了，不划算。
#
# 注意：stop_when_no_lexical_hit 依赖 BM25 通道有命中。如果语料是纯英文而提问是中文
# （跨语言场景），BM25 合法地为 0，这个止损会误停 —— 那种语料下不要开。
extends: config.casebook.yaml

agentic:
  stop_when_no_lexical_hit: true
